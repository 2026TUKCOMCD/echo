spring:
  datasource:
    url: jdbc:mysql://localhost:3306/echo_test_db?useSSL=false&serverTimezone=Asia/Seoul&characterEncoding=UTF-8&allowPublicKeyRetrieval=true
    username: echouser
    password: ${DB_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MySQL8Dialect
    defer-datasource-initialization: false
  sql:
    init:
      mode: never

# OpenAI API 설정 (STT 전용)
openai:
  api:
    url: https://api.openai.com/v1
    key: ${OPENAI_API_KEY:}
  whisper:
    model: whisper-1
    language: ko

# OpenRouter API 설정 (채팅 전용)
openrouter:
  api:
    url: https://openrouter.ai/api/v1
    key: ${OPENROUTER_API_KEY:}
  chat:
    models:
      - openai/gpt-5.5
      - anthropic/claude-sonnet-5
      - google/gemini-3.1-flash-lite
      - anthropic/claude-haiku-4.5
    temperature: 0.7
    max-tokens: 512

# Azure Cognitive Services TTS 설정
azure:
  tts:
    endpoint: https://koreacentral.tts.speech.microsoft.com
    api-key: ${AZURE_TTS_API_KEY:}
    default-voice: ko-KR-SunHiNeural

# Supertone Play TTS 설정
supertone:
  base-url: https://supertoneapi.com
  api-key: ${SUPERTONE_API_KEY:}

logging:
  level:
    feign: DEBUG
    com.example.echo: DEBUG
