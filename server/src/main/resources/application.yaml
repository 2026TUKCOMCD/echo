spring:
  profiles:
    active: local

  # Deploy trigger
  application:
    name: echo
  datasource:
    url: jdbc:mysql://localhost:3306/echo_db?useSSL=false&serverTimezone=Asia/Seoul&characterEncoding=UTF-8&allowPublicKeyRetrieval=true
    username: echouser
    # password는 application-local.yaml에서 설정
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update  # 개발 중에는 update, 운영에서는 validate/ update 설정이면 처음에 테이블 생성, 이후에는 변경이 없으면 테이블 건드리지 않음
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MySQL8Dialect
    defer-datasource-initialization: true  # JPA 테이블 생성 후 data.sql 실행

  # SQL 초기화 설정 (data.sql 실행)
  sql:
    init:
      mode: always  # 매 시작마다 data.sql 실행 (개발용)

  # 비동기 작업(장기기억 추출 등) 스레드풀 - 배포/재시작 시 진행 중인 작업을 최대한 마치고 종료
  task:
    execution:
      shutdown:
        await-termination: true
        await-termination-period: 30s

# 지연 측정용 - echo.conversation.stage(STT/LLM/TTS 구간별), feign.client.requests/http.client.requests
# (Feign 클라이언트별 순수 네트워크 구간, feign-micrometer가 이미 자동 계측 중)를 /actuator/metrics 로 조회.
# health 외엔 SecurityConfig에서 permitAll이 아니므로 기존 인증 그대로 필요함 (별도 공개 아님)
management:
  endpoints:
    web:
      exposure:
        include: health,metrics

openai:
  api:
    url: https://api.openai.com/v1
  whisper:
    model: whisper-1
    language: ko
    # [STT 환각 방지] 아래는 모두 기본값 - 필요 시 환경별로 override
    min-duration-ms: 300
    min-energy-dbfs: -45.0
    no-speech-threshold: 0.6
    logprob-threshold: -1.0
    compression-ratio-threshold: 2.4

# OpenRouter (채팅 전용) - 단일 모델(terra)로 고정
openrouter:
  api:
    url: https://openrouter.ai/api/v1
  chat:
    model: openai/gpt-5.6-terra
    temperature: 0.7
    max-tokens: 1024

kakao:
  api:
    url: https://dapi.kakao.com
    # key는 application-local.yaml에서 설정

# OpenWeatherMap API 설정
weather:
  api:
    url: https://api.openweathermap.org
    # api-key는 application-local.yaml에서 설정

# Azure Cognitive Services TTS 설정
azure:
  tts:
    endpoint: https://koreacentral.tts.speech.microsoft.com
    # api-key는 application-local.yaml에서 설정 (예: api-key: your-key-here)
    default-voice: ko-KR-SunHiNeural  # 기본 음성 (친근하고 따뜻한 여성)

# TTS 프로바이더 설정 (azure | elevenlabs)
tts:
  provider: elevenlabs

# JWT 설정
jwt:
  # secret은 application-local.yaml(${JWT_SECRET})에서 주입
  access-token-expiration: 3600000      # 1시간
  refresh-token-expiration: 2592000000  # 30일

# ElevenLabs TTS 설정
elevenlabs:
  base-url: https://api.elevenlabs.io/v1
  voice-id: zmh5xhBvMzqR4ZlXgcgL
  model: eleven_v3
  # api-key는 application-local.yaml에서 설정 (예: api-key: your-key-here)

# 민감정보 컬럼 암호화 (EncryptedStringConverter)
# - Spring 프로퍼티가 아니라 System.getenv("ENCRYPTION_KEY")로 직접 읽음 (JPA 메타데이터 부트스트랩과
#   무관하게 실제 암호화/복호화 시점에만 키를 검증하기 위함 - 상세 이유는 컨버터 클래스 주석 참고)
# - 로컬 개발 시 OS 환경변수로 ENCRYPTION_KEY(Base64 인코딩된 32바이트 AES-256 키)를 설정할 것
# - 생성 예시: openssl rand -base64 32
