plugins {
	id 'java'
	id 'org.springframework.boot' version '3.5.9'
	id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.example'
version = '0.0.1-SNAPSHOT'
description = 'Demo project for Spring Boot'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(17)
	}
}

configurations {
	compileOnly {
		extendsFrom annotationProcessor
	}
}

repositories {
	mavenCentral()
}

ext {
	set('springCloudVersion', "2025.0.0")
}

dependencyManagement {
	imports {
		mavenBom "org.springframework.cloud:spring-cloud-dependencies:${springCloudVersion}"
	}
}

dependencies {
	runtimeOnly 'com.mysql:mysql-connector-j:8.0.33'

	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
	implementation 'org.springframework.boot:spring-boot-starter-validation'
	implementation 'org.springframework.boot:spring-boot-starter-web'
	implementation 'org.springframework.boot:spring-boot-starter-actuator'
	implementation 'org.springframework.boot:spring-boot-starter-security'

	// JWT (jjwt 0.12.x)
	implementation 'io.jsonwebtoken:jjwt-api:0.12.6'
	runtimeOnly 'io.jsonwebtoken:jjwt-impl:0.12.6'
	runtimeOnly 'io.jsonwebtoken:jjwt-jackson:0.12.6'

	// Caffeine Cache
	implementation 'org.springframework.boot:spring-boot-starter-cache'
	implementation 'com.github.ben-manes.caffeine:caffeine'

	// OpenFeign
	implementation 'org.springframework.cloud:spring-cloud-starter-openfeign'
	implementation 'io.github.openfeign:feign-micrometer'
	// Feign 커넥션 풀링 - 두 의존성이 모두 있어야 Spring Cloud OpenFeign이 기본 미풀링 클라이언트
	// (JDK HttpURLConnection) 대신 PoolingHttpClientConnectionManager 기반 ApacheHttp5Client로 전환한다.
	// 자동 설정 조건이 @ConditionalOnClass(feign.hc5.ApacheHttp5Client)라서 httpclient5만으로는 적용되지 않음.
	// 기본 클라이언트도 keep-alive 재사용은 하지만 유휴 약 5초 후 연결을 버려서, 대화 턴 사이마다 새 TLS 연결을 맺었다.
	// 모든 Feign 클라이언트(STT/LLM/TTS/날씨/지오코딩)에 공통 적용되며, 클라이언트별 readTimeout은 그대로 유지됨.
	implementation 'org.apache.httpcomponents.client5:httpclient5'
	implementation 'io.github.openfeign:feign-hc5'

	// Spring Retry (RetryTemplate — AOP 불필요)
	implementation 'org.springframework.retry:spring-retry'
	compileOnly 'org.projectlombok:lombok'
	developmentOnly 'org.springframework.boot:spring-boot-devtools'
	runtimeOnly 'com.mysql:mysql-connector-j'
	annotationProcessor 'org.springframework.boot:spring-boot-configuration-processor'
	annotationProcessor 'org.projectlombok:lombok'
	testImplementation 'org.springframework.boot:spring-boot-starter-test' //JUnit5 + Mockito + AssertJ(검증) + Sprint Test 포함
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
	testRuntimeOnly 'com.h2database:h2'  // Repository 테스트용 인메모리 DB
	implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:2.3.0'
    implementation 'org.apache.commons:commons-lang3:3.17.0' // 또는 그 이상의 최신 버전
}

tasks.named('test') {
	useJUnitPlatform()
}
